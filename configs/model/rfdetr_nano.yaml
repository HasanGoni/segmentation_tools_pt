# RF-DETR instance segmentation, size: nano  (trained by segpt-train via model.source=rfdetr; see docs/TRAINING_CLI.md).
# Compose: defaults: [model: rfdetr_nano]  and set model.source=rfdetr (train.yaml's own model.source: smp wins over a
# package default, so use configs/train_rfdetr_example.yaml or pass model.source=rfdetr on the command line).
# Needs the optional extra:  uv sync --extra rfdetr --prerelease=allow   (separate environment recommended).
family: rfdetr             # lets scripts/train.py catch `model=rfdetr_*` without `model.source=rfdetr`
source: rfdetr
arch: nano                    # nano | small | medium
architecture: rfdetr        # label only; get_model() is never called for RF-DETR
pretrained: true            # RF-DETR downloads its own COCO weights
weights_path: null
rfdetr:
  segmentation: auto        # COCO mask type written from the patch cache: auto | polygon | rle
