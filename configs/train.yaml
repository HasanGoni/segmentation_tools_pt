# Hydra config for end-to-end segmentation training.
# Override on the CLI, e.g.:
#   segpt-train configs/train.yaml data.raw_dir=/path/to/raw train.epochs=80
#
# Shares data + patch settings with segpt-build via defaults: [data_patch].

defaults:
  - data_patch
  - model: mobilenet_v2   # library default; switch with model=dinov3_vit_small|convnext_tiny|efficientnetv2_s
  - _self_

data:
  build_only: false

# model.* comes from configs/model/<name>.yaml (architecture, arch, pretrained, weights_path).
# data_patch supplies model.in_channels. Override any field on the CLI, e.g. model.pretrained=true.

model:
  source: smp               # smp (default) | custom_unet  -> segpt-train ... model.source=custom_unet
  # custom_unet:            # used only when source=custom_unet (random-init classic UNet)
  #   encoder_depth: recommend  # recommend | auto | <int>; recommend/auto size the net from train.crop_size, clamped to [3, 6]
  #   bottleneck_min_size: 32   # smallest bottleneck side recommend/auto aim for (512 crop -> 4 downs)
  #   base_channels: 32
  #   max_channels: 512
  #   num_groups: 8         # GroupNorm only; lowered per layer to a divisor of the channel count
  #   norm: group           # group (default) | batch | instance
  #   # random-init: train() forces freeze_epochs=0 and encoder_lr=decoder_lr (with a warning);
  #   # set freeze_epochs / encoder_lr here to override

train:
  epochs: 100
  batch_size: 16
  encoder_lr: 1.0e-4
  decoder_lr: 1.0e-3
  freeze_epochs: 5          # 0 = no freeze; N > 0 = unfreeze at epoch N; -1 = encoder frozen forever
  crop_size: 656           # model-view crop size; must be <= patch.patch_size in patch mode
  use_amp: true
  save_every: 5
  resume: false
  resume_from: null
  device: cuda
  num_workers: 4            # DataLoader workers — needs TMPDIR=/tmp on HPC
  prefetch_factor: null     # batches kept in flight per worker (needs num_workers > 0); null = torch default (2)

loss:
  alpha: 0.7
  beta: 0.3
  gamma: 1.33
  phases:
    - until_epoch: 10
      w_tversky: 0.6
      w_dice: 0.4
      w_boundary: 0.0
    - until_epoch: 35
      w_tversky: 0.5
      w_dice: 0.3
      w_boundary: 0.2
    - until_epoch: -1
      w_tversky: 0.4
      w_dice: 0.3
      w_boundary: 0.3

metrics:
  threshold: 0.5
  best_metric: iou

augment:
  preset: yolo26m
  translate: null
  scale: null
  degrees: null
  shear: null
  perspective: 0.0
  fliplr: 0.0
  flipud: 0.0
  hsv_h: null
  hsv_s: null
  hsv_v: null
  bgr: 0.0
  erasing: 0.0
  erasing_scale_min: 0.02
  erasing_scale_max: 0.33
  erasing_ratio_min: 0.3
  erasing_ratio_max: 3.3
  erasing_fill: 0.0
  batch:                           # batch-level augs (issue #17): pick-one, at most one type per batch
    enabled: false                 # master switch — false = training identical to no batch aug
    mosaic: 0.0                    # per-batch probs (marginal); all 0 = no-op even when enabled
    mixup: 0.0
    cutmix: 0.0
    copy_paste: 0.0
    copy_paste_mode: flip          # 'flip' = paste horizontally-mirrored donor foreground
  extra_legacy: false
  flips: false                   # keep false for orientation-sensitive X-ray; true only for symmetric layouts
  boundary_blur: 0.4              # probability; 0 = disabled
  boundary_blur_width: [5, 21]    # morphological edge band (pixels, odd)
  boundary_blur_sigma: [3, 11]    # Gaussian sigma for edge smearing
  boundary_halo_brightness: [0.0, 0.15]  # outer-band brighten; [0, 0] = blur only

postprocess:                       # inference/eval decode only — never applied to loss or raw train metrics
  class_morph:                     # class-targeted morph cleanup (issue #19); resolve via resolve_class_morph_cfg
    enabled: false                 # master switch — false = decode unchanged (strict no-op)
    class_name: null               # class to clean, e.g. void — resolved against data.class_names; unknown name fails clearly
    kernel_size: 3                 # opening structuring element side (odd); kills thin speckles
    min_area: 16                   # drop connected components smaller than this many pixels (1 = keep all)

monitoring:
  metrics_log:
    per_class: true       # train_iou_<class> / val_iou_<class> in history.json + metrics.csv (foreground only, background never listed)
    console_per_class: false  # also print per-class val IoU on each epoch line
    csv: true             # write metrics.csv next to history.json every epoch
  activation_stats:
    enabled: true
    every: 1              # collect histogram every N train batches
    n_bins: 40
    hist_range: [0, 10]   # histc min/max for activation values
    max_layers: 6         # evenly spaced Conv/BN hooks across the model
  pred_overlays:
    enabled: true
    every: 1              # save overlays every N epochs
    max_val_batches: 3    # YOLO-style: first N validation batches
    jpeg_quality: 90
  error_analysis:
    enabled: false        # post-training worst-sample posters; default off (existing runs unchanged)
    top_k: 12             # worst samples per split (and per class)
    rank_by: loss         # loss | iou | dice | recall | precision
    splits: [train, val]  # both ranked/postered when enabled
    alpha: 0.1            # GT / pred overlay transparency
    jpeg_quality: 90
    per_class: true       # multilabel: one poster per class head
  encoder_drift_check:
    enabled: false        # verify encoder weights unchanged after training; set true for freeze-forever (freeze_epochs: -1) DINOv3 runs
    expect_frozen: null   # null = derive from train.freeze_epochs == -1; true = raise if drifted; false = report only

export:
  onnx: false             # FP32 ONNX export (dynamic batch, opset 18, runtime-verified); no INT8/TensorRT
  opset: 18
  verify: true

inference:                  # production tiled-inference knobs (`predict_tiled`, issue #20)
  tile_size: 256            # tile side fed to the model
  overlap: 32               # adjacent-tile overlap; Gaussian blending stitches tiles back
  inference_batch_size: 8   # tiles per forward — raise for throughput, lower if OOM (results unchanged)
  prefetch_factor: null     # loader-driven tiled inference only; predict_tiled batches in-process and ignores it

hpc:
  job_name: segpt_train
  queue: gpu
  device: gpu
  interactive: true
  num_gpus: 1
  j_exclusive: true
  gpu_mem_gb: 24
  host: ""
  num_cpus: 8
  mem_gb: 200
  resource_select: ""
  project: ""
  env_activate: "source .venv/bin/activate"
  repo_dir: "/path/to/segmentation_tools_pt"
