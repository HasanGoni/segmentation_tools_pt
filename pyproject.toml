[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation_tools_pt"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Goni Mohammed Hasan", email = "hasanme1412@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "albumentations>=2.0.8",
    #"numpy",
    #"opencv-python-headless",
    "matplotlib",
    #"albumentations",
    #"onnx",
    #"onnxruntime",
    "fastcore>=1.13.2",
    "hydra-core>=1.3",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.7",
    "loguru>=0.7.3",
    "nbdev>=3.0.17",
    "opencv-python-headless",
    "segmentation-models-pytorch>=0.5.0",
    "timm>=1.0.28",  # needed directly (not just via smp) for the DINOv3 encoder in model.py
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[project.optional-dependencies]
# RF-DETR segmentation (`model.source=rfdetr`): `uv sync --extra rfdetr` (locked in uv.lock). rfdetr 1.12 needs the pre-release
# torch-hungarian 0.1.0rc0; naming it here is what lets uv resolve it without `--prerelease=allow`,
# preferably in a separate environment from the U-Net one. >=1.12: rfdetr 1.9.4 (what a plain `uv sync --extra rfdetr` picked) rejects
# the 1-channel models segpt-train makes ("Invalid tensor image shape ... (3, 512, 512)").
rfdetr = ["rfdetr[train]>=1.12", "torch-hungarian>=0.1.0rc0"]

[project.urls]
Repository = "https://github.com/HasanGoni/segmentation_tools_pt"
Documentation = "https://hasangoni.github.io/segmentation_tools_pt/"

[project.scripts]
segpt-build  = "segmentation_tools_pt.cli:segpt_build"
segpt-train  = "segmentation_tools_pt.cli:segpt_train"
segpt-submit = "segmentation_tools_pt.cli:segpt_submit"
segpt-eval   = "segmentation_tools_pt.cli:segpt_eval"
segpt-sweep  = "segmentation_tools_pt.cli:segpt_sweep"
segpt-heldout = "segmentation_tools_pt.cli:segpt_heldout"
segpt-rfdetr-benchmark = "segmentation_tools_pt.cli:segpt_rfdetr_benchmark"

[project.entry-points.nbdev]
segmentation_tools_pt = "segmentation_tools_pt._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "segmentation_tools_pt.__version__"}


[tool.setuptools.packages.find]
where = ["src"]

[tool.nbdev]
lib_path = "src/segmentation_tools_pt"
